# Development broker (private network only). Weeks 1-4.
# 1883 = MQTT for the simulator / ESP32, 9001 = MQTT over WebSockets for the browser app.
# allow_anonymous is for LAN testing only. Week 8 adds logins and TLS (and the cloud broker already has both).
listener 1883
allow_anonymous true

listener 9001
protocol websockets
allow_anonymous true
